# Runs CRM cron calls every 5 minutes, including external Twenty polling and
# approval-only workflow preparation. Twenty workflows start disabled.
#
# Vercel's Hobby plan only allows the two daily crons in vercel.json, so these
# routes are triggered from GitHub Actions instead. The repo is public, so
# Actions minutes are free. GitHub's minimum schedule interval is 5 minutes;
# scheduled runs may be delayed, and GitHub disables schedules after 60 days
# without repo activity.
#
# The repo owner must add a CRON_SECRET repository secret (same value as the
# CRON_SECRET env var in Vercel). Without it the workflow warns and skips.
name: crm-cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: lead-finder-cron
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 21
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Check CRON_SECRET
        id: check
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo '::warning::CRON_SECRET repository secret is not set; skipping'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Call lead-finder-worker
        id: worker
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          curl -fsS --max-time 300 -H "Authorization: Bearer $CRON_SECRET" https://pulse-crm-weld.vercel.app/api/cron/lead-finder-worker

      - name: Call lead-finder scheduler
        id: scheduler
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          curl -fsS --max-time 295 -H "Authorization: Bearer $CRON_SECRET" https://pulse-crm-weld.vercel.app/api/cron/lead-finder

      - name: Call automation executor
        id: automation
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" https://pulse-crm-weld.vercel.app/api/cron/automation-executor

      - name: Call sequence executor
        id: sequences
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" https://pulse-crm-weld.vercel.app/api/cron/sequence-executor

      - name: Poll Twenty sales workflows
        id: twenty_poll
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          curl -fsS --max-time 120 -H "Authorization: Bearer $CRON_SECRET" https://pulse-crm-weld.vercel.app/api/cron/twenty-poll

      - name: Prepare Twenty workflow approvals
        id: twenty_worker
        if: steps.check.outputs.skip != 'true'
        continue-on-error: true
        run: |
          curl -fsS --max-time 180 -H "Authorization: Bearer $CRON_SECRET" https://pulse-crm-weld.vercel.app/api/cron/twenty-worker

      - name: Fail if any request failed
        if: steps.check.outputs.skip != 'true' && (steps.worker.outcome == 'failure' || steps.scheduler.outcome == 'failure' || steps.automation.outcome == 'failure' || steps.sequences.outcome == 'failure' || steps.twenty_poll.outcome == 'failure' || steps.twenty_worker.outcome == 'failure')
        run: echo '::error::a cron request failed' && exit 1
